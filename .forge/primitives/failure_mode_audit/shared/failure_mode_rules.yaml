# Failure mode detection rules — data-driven, edited via PR.
# Schema documented in primitives/failure_mode_audit/SPEC.md.

fm1_hallucinated_deps:
  name: Hallucinated Dependencies
  description: |
    Imports / package refs that don't exist in the project's declared dependencies.
  detectors:
    - lang: python
      kind: import-not-in-deps
      file_patterns: ["*.py"]
      manifest_files: ["pyproject.toml", "requirements.txt"]
    - lang: javascript
      kind: import-not-in-deps
      file_patterns: ["*.js", "*.ts", "*.jsx", "*.tsx"]
      manifest_files: ["package.json"]
    - lang: java
      kind: import-not-in-deps
      file_patterns: ["*.java"]
      manifest_files: ["pom.xml", "build.gradle", "build.gradle.kts"]

fm2_context_window:
  name: Context Window Blindness
  description: |
    Cross-file refs where the AI likely couldn't have seen the full target.
    Heuristic: function/class refs where the defining file is > 1500 lines
    or > 3 directory hops away.
  detectors:
    - kind: cross-file-large-target
      threshold_target_lines: 1500
      threshold_dir_hops: 3

fm3_training_bias:
  name: Training Data Bias
  description: |
    Stack idioms that look like outdated versions.
  detectors:
    - lang: python
      kind: idiom-mismatch
      file_patterns: ["*.py"]
      patterns:
        - regex: "^\\s*print [^()]"
          severity: medium
          msg: "Python 2 print statement in Python 3 codebase"
        - regex: "raise \\w+, "
          severity: high
          msg: "Python 2 raise syntax"
    - lang: javascript
      kind: idiom-mismatch
      file_patterns: ["*.js", "*.jsx", "*.ts", "*.tsx"]
      patterns:
        - regex: "createReactClass"
          severity: medium
          msg: "Pre-hooks React class-component idiom"
        - regex: "var\\s+\\w+\\s*="
          severity: low
          msg: "var instead of let/const"

fm4_overconfident:
  name: Overconfident Completions
  description: |
    Docstrings/comments asserting behavior the code doesn't deliver.
  detectors:
    - kind: assertion-without-evidence
      patterns:
        - regex: "(?i)\\b(guarantee[sd]?|always works?|never fails?)\\b"
          severity: medium
          file_patterns: ["*.py", "*.js", "*.ts", "*.java"]
          msg: "Confident assertion in comment — verify implementation backs it up"

fm5_security_propagation:
  name: Security Vulnerability Propagation
  description: |
    Patterns the AI might propagate from training data: hardcoded secrets,
    SQL string concat, eval, XSS sinks.
  detectors:
    - kind: hardcoded-secret
      patterns:
        - regex: "(?i)(password|secret|api[_-]?key|token)\\s*=\\s*[\"'][a-zA-Z0-9]{8,}[\"']"
          severity: critical
          msg: "Possible hardcoded secret"
        - regex: "AKIA[0-9A-Z]{16}"
          severity: critical
          msg: "AWS access key"
        - regex: "ghp_[a-zA-Z0-9]{36}"
          severity: critical
          msg: "GitHub personal access token"
        - regex: "sk-ant-[a-zA-Z0-9]{20,}"
          severity: critical
          msg: "Anthropic API key"
    - kind: sql-injection
      patterns:
        - regex: "execute\\s*\\(\\s*[\"'].*\\+\\s*\\w+"
          severity: high
          file_patterns: ["*.py", "*.js", "*.ts"]
          msg: "SQL string concatenation — use parameterized queries"
    - kind: code-injection
      patterns:
        - regex: "\\beval\\s*\\("
          severity: high
          file_patterns: ["*.py", "*.js", "*.ts"]
          msg: "eval() — prefer safer alternatives"
        - regex: "\\bexec\\s*\\("
          severity: high
          file_patterns: ["*.py"]
          msg: "exec() — prefer safer alternatives"
